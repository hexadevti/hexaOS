# hexaOS sound defaults (WirePlumber 0.5)

# Laptops whose sound card has the speakers and the headphone jack in two
# separate profiles (UCM "HiFi (..., Speaker)" and "HiFi (..., Headphones)",
# e.g. Intel SOF on the Samsung Galaxy Book): keep the speaker profile, and
# switch to the headphone one only while headphones are plugged in. Without
# this, plugging an HDMI screen makes WirePlumber pick the headphone profile
# and the speakers disappear from the sound outputs.
wireplumber.components = [
  {
    name = hexaos/jack-profile.lua, type = script/lua
    provides = hooks.device.profile.hexaos-jack
  }
]

wireplumber.profiles = {
  main = {
    hooks.device.profile.hexaos-jack = required
  }
}
