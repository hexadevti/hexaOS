# Template for a hexaOS app (C + GTK 3). To start a new one:
#   cp -r com.hexaos.Hello com.hexaos.MyApp, then rename Hello -> MyApp in the
#   file names and inside the files. Build and install: make APP=com.hexaos.MyApp
id: com.hexaos.Hello
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: hexa-hello
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: hexa-hello
    buildsystem: simple
    build-commands:
      - make -C src PREFIX=/app install
      - install -Dm644 data/com.hexaos.Hello.desktop -t /app/share/applications
      - install -Dm644 data/com.hexaos.Hello.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/com.hexaos.Hello.svg -t /app/share/icons/hicolor/scalable/apps
      # PNG copies for the hexaOS Start menu (Weston reads PNG only)
      - for s in 64 128; do mkdir -p /app/share/icons/hicolor/${s}x${s}/apps;
        rsvg-convert -w $s -h $s data/com.hexaos.Hello.svg
        -o /app/share/icons/hicolor/${s}x${s}/apps/com.hexaos.Hello.png; done
    sources:
      - type: dir
        path: .
