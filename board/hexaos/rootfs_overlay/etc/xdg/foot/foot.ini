# hexaOS Terminal (foot). Personal changes: copy this file to
# ~/.config/foot/foot.ini and edit it there.
#
# Copy and paste (works with every other app):
#   select text with the mouse  -> it is copied right away
#   right-click                 -> paste
#   Ctrl+Shift+C, Ctrl+Insert   -> copy
#   Ctrl+V, Ctrl+Shift+V,
#   Shift+Insert                -> paste
#   (Ctrl+C still stops the running program, as in every terminal)
# More:
#   Ctrl+Shift+F   find in the output         Ctrl + / Ctrl - / Ctrl 0  text size
#   Ctrl+Shift+N   new window (same folder)   Ctrl+Shift+O  open a link with the keyboard
#   Ctrl+click     open a link                Shift+PgUp/PgDn  scroll
#   Ctrl+Shift+Z / Ctrl+Shift+X  jump to the previous / next command
#   F11            full screen                Ctrl+Shift+U  type a Unicode character

font=DejaVu Sans Mono:size=11
pad=8x8
term=xterm-256color
# login shell: loads /etc/profile (language, colored prompt, history...)
login-shell=yes
# Selected text goes to the clipboard as well (so plain Ctrl+V pastes it anywhere)
selection-target=both
resize-by-cells=no

[scrollback]
lines=10000
multiplier=3.0

[url]
launch=xdg-open ${url}

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors]
alpha=0.94
background=0b1220
foreground=d6e2f0
selection-background=1e3a5f
selection-foreground=ffffff
urls=22d3ee
cursor=0b1220 22d3ee
regular0=1b2433
regular1=f87171
regular2=4ade80
regular3=facc15
regular4=3b82f6
regular5=c084fc
regular6=22d3ee
regular7=d6e2f0
bright0=56657a
bright1=fca5a5
bright2=86efac
bright3=fde68a
bright4=93c5fd
bright5=d8b4fe
bright6=67e8f9
bright7=ffffff

[key-bindings]
clipboard-copy=Control+Shift+c Control+Insert XF86Copy
clipboard-paste=Control+v Control+Shift+v Shift+Insert XF86Paste
primary-paste=none
search-start=Control+Shift+f Control+Shift+r
show-urls-launch=Control+Shift+o
prompt-prev=Control+Shift+z
prompt-next=Control+Shift+x
fullscreen=F11
font-reset=Control+0 Control+KP_0

[search-bindings]
find-prev=Control+r Shift+F3
find-next=Control+s F3

[mouse-bindings]
# Right-click pastes (as in the Windows console); Ctrl+right-click extends a selection
clipboard-paste=BTN_RIGHT
select-extend=Control+BTN_RIGHT
select-extend-character-wise=none
primary-paste=BTN_MIDDLE
