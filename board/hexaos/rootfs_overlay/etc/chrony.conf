# hexaOS: set the clock from the internet (chronyd, started by S49chronyd).
# Works offline too: it simply waits until a network is available.
pool pool.ntp.org iburst

# Laptops can be off for weeks: correct a large error at any time by
# jumping, instead of slowly adjusting
makestep 1 -1

# Keep the hardware clock (RTC, in UTC) in sync, so the time is right at boot
rtcsync

driftfile /var/lib/chrony/drift
