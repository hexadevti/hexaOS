# Area de trabalho do hexaOS (Weston, shell "desktop")

[core]
idle-time=0
require-input=false

[shell]
background-image=/usr/share/hexaos/wallpaper.png
background-type=scale-crop
background-color=0xff0b1220
panel-color=0xe00b1220
panel-position=top
clock-format=minutes
locking=false
animation=zoom
startup-animation=fade

[keyboard]
keymap_layout=br
keymap_variant=abnt2

[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/bin/foot

[launcher]
icon=/usr/share/weston/icon_editor.png
path=/usr/bin/foot --title=Editor nano
