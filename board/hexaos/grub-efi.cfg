# Menu oculto: segure Esc ou Shift durante o boot para ver as opcoes
set default="0"
set timeout_style=hidden
set timeout="1"

menuentry "hexaOS" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait quiet loglevel=3 vt.global_cursor_default=0 console=ttyS0,115200 console=tty3
}

menuentry "hexaOS (modo texto, mensagens detalhadas)" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait hexaos.text console=ttyS0,115200 console=tty1
}

menuentry "hexaOS (modo seguro: sem graficos nem drivers de video)" {
	linux /bzImage root=PARTUUID=UUID_TMP rootwait hexaos.text nomodeset modprobe.blacklist=i915 console=tty1
}

menuentry "Configuracoes do firmware (UEFI)" {
	fwsetup
}
