# hexaOS desktop (Weston, "desktop" shell)

[core]
idle-time=0
require-input=false
# X11 apps (Steam): Xwayland starts on demand, Weston sets DISPLAY for apps
xwayland=true

[shell]
background-image=/usr/share/hexaos/wallpaper.png
background-type=scale-crop
background-color=0xff0b1220
# Windows-style taskbar at the bottom: Start menu, shortcuts, open windows,
# volume and clock (patches/weston/0002-*)
panel-color=0xe80b1220
panel-position=bottom
clock-format=minutes
clock-date-format=%d/%m/%Y
locking=false
animation=zoom
startup-animation=fade

# Runs once the desktop is up: hands DISPLAY (Xwayland) and WAYLAND_DISPLAY to
# the D-Bus session, which X11 apps such as Steam check
[autolaunch]
path=/usr/libexec/hexaos-session-env

# Physical keyboard layout of the laptop (Brazilian ABNT2)
[keyboard]
keymap_layout=br
keymap_variant=abnt2

# Apps: every [launcher] is in the Start menu (Super key or the hexaOS
# button). pinned=true also puts it on the taskbar. app-id gives its icon
# to the windows of that app on the taskbar (otherwise the program name
# is compared with the app id, e.g. firefox). folder=NAME shows it inside
# that folder of the Start menu (Flatpak apps use folder=Apps).
# Right-click a taskbar button to pin or unpin it: your choice is saved in
# ~/.config/hexaos/taskbar-pins and then replaces the pinned=true keys.
# Right-click an app in the Start menu to remove it from the menu: saved in
# ~/.config/hexaos/start-hidden (right-click Start > Restore removed Start
# apps brings them all back).

[launcher]
displayname=Terminal
icon=/usr/share/weston/terminal.png
path=/usr/bin/foot
pinned=true

[launcher]
displayname=Firefox
icon=/usr/share/hexaos/firefox.png
path=/usr/bin/firefox
pinned=true

[launcher]
displayname=Text Editor
icon=/usr/share/weston/icon_editor.png
path=/usr/bin/foot --app-id=hexa-editor --title=Editor nano
app-id=hexa-editor

# Windows programs: opens Wine Notepad
[launcher]
displayname=Windows Programs (Wine)
icon=/usr/share/hexaos/wine.png
path=/usr/bin/wine notepad
app-id=notepad.exe

# Files: the file manager (hexa-files), like Windows Explorer
[launcher]
displayname=Files
icon=/usr/share/hexaos/files.png
path=/usr/bin/hexa-files
app-id=org.hexaos.Files
pinned=true

# hexaOS Store: apps from Flathub (hexa-store; apps/com.hexaos.Store)
[launcher]
displayname=Store
icon=/usr/share/hexaos/store.png
path=/usr/bin/hexa-store
app-id=com.hexaos.Store

# hexaOS Settings (Wi-Fi, sound, display, keyboard, date and time...)
[launcher]
displayname=Settings
icon=/usr/share/hexaos/settings.png
path=/usr/bin/hexa-settings
app-id=org.hexaos.Settings

# Task Manager: running programs (end them) and CPU, memory, disk and
# network graphs. Also Ctrl+Shift+Esc, or right-click the taskbar.
[launcher]
displayname=Task Manager
icon=/usr/share/hexaos/taskmgr.png
path=/usr/bin/hexa-taskmgr
app-id=org.hexaos.TaskManager

# hexaOS Setup: applies this machine's settings (Wi-Fi network...) in one go
[launcher]
displayname=Setup
icon=/usr/share/hexaos/setup.png
path=/usr/bin/foot --app-id=hexa-setup --title=Setup --window-size-chars=90x30 /usr/bin/hexa-setup
app-id=hexa-setup

# Power: shut down, restart, or restart the desktop (a window; hexa-power-gui)
[launcher]
displayname=Power
icon=/usr/share/hexaos/power.png
path=/usr/bin/hexa-power
app-id=hexa-power
